<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded dark background -->
  <rect width="100" height="100" rx="24" fill="#090d16" />
  
  <!-- Outer border gradient glow -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#glow-grad)" stroke-width="4" />
  
  <!-- Glowing Monospace developer "K" monogram -->
  <text x="50%" y="54%" font-family="monospace, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas" font-weight="900" font-size="44" fill="url(#logo-grad)" text-anchor="middle" dominant-baseline="middle">&lt;K/&gt;</text>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" /> <!-- emerald-500 -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- cyan-500 -->
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" /> <!-- emerald-400 -->
      <stop offset="100%" stop-color="#22d3ee" /> <!-- cyan-400 -->
    </linearGradient>
  </defs>
</svg>